document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const pass=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Unlocking...';try{const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(B.salt),iterations:B.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(B.iv)},key,bytes(B.ciphertext));pass.value='';const text=new TextDecoder('utf-8',{fatal:true}).decode(clear);document.open();document.write(text);document.close()}catch(err){status.textContent='That password did not unlock the dashboard.';button.disabled=false;pass.value='';pass.focus()}});
</script></body></html>
